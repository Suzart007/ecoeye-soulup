# Testes automatizados: banco H2 em memoria, no modo de compatibilidade Oracle,
# criado com a mesma estrutura e a mesma carga inicial do modelo.sql.
spring.datasource.url=jdbc:h2:mem:soulup;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:h2/schema.sql
spring.sql.init.data-locations=classpath:h2/data.sql
spring.sql.init.encoding=UTF-8

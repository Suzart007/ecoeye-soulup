spring.application.name=soulup-api

# Porta: na Vercel o Dockerfile define PORT=80; localmente a API sobe em 8080.
server.port=${PORT:8080}

# Arquivo .env opcional na raiz do projeto (DB_USER=..., DB_PASSWORD=...).
# Ele esta no .gitignore: a senha nunca vai para o GitHub.
spring.config.import=optional:file:.env[.properties]

# Banco Oracle da FIAP. Usuario e senha vem SEMPRE de variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno: o Oracle da FIAP limita o numero de conexoes por aluno.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=15000

# Origens liberadas no CORS (separadas por virgula). O padrao ja libera o front local
# e o front publicado na Vercel com o nome do repositorio (ecoeye-soulup...vercel.app).
soulup.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://ecoeye-soulup*.vercel.app}

# Datas no formato AAAA-MM-DD / AAAA-MM-DDTHH:MM:SS
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=always
